name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # Publishes the static site to GitHub Pages when the repository's DEFAULT branch is pushed —
  # whatever it is called. Hard-coding 'main' silently disabled the job in a repository whose
  # default branch is named anything else, so a published fix never reached anyone.
  # Enable Pages (Settings -> Pages -> Source: GitHub Actions) for this to take effect.
  deploy-pages:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
